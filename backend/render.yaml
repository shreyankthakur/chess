services:
  - type: web_service
    name: chess-anime-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: '0'
      - key: DJANGO_SECRET_KEY
        generator: secret
      - key: DJANGO_ALLOWED_HOSTS
        value: '*'
      - key: PORT
        value: '10000'